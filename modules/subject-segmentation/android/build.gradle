plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.subjectsegmentation'
version = '1.0.0'

android {
  namespace "expo.modules.subjectsegmentation"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Unbundled model, fetched through Google Play services (see prepareAsync).
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
  // ModuleInstallClient: check for and download the model with progress.
  implementation "com.google.android.gms:play-services-base:18.5.0"
  implementation "androidx.exifinterface:exifinterface:1.4.2"
}
