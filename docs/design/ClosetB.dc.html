<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Closet — Closet, elevation direction</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.mc{--bg:#F7F3EE;--surface:#FFFFFF;--tint:#EFE8DF;--tint2:#E4D9CB;--ink:#1C1A17;--muted:#6E6860;--faint:#8A847C;--line:rgba(28,26,23,.09);--line2:rgba(28,26,23,.17);--accent:#E2553F;--accent-fill:#C2412C;--on-accent:#FFFFFF;--accent-text:#B23A26;--sec:#2F4B3A;--sec-soft:#DFE8E1;--warning:#8A5A12;--shadow:rgba(84,58,34,.24);--shadow2:rgba(84,58,34,.12);--rail:#B9AE9F;--wood:#E8DFD3;--glass:rgba(255,255,255,.86);--inv:#1C1A17;--on-inv:#F7F3EE;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.mc.dark{--bg:#121110;--surface:#1D1B19;--tint:#26231F;--tint2:#312C27;--ink:#F3EEE8;--muted:#9C958C;--faint:#6F6962;--line:rgba(243,238,232,.08);--line2:rgba(243,238,232,.17);--accent:#FF7A5C;--accent-fill:#FF7A5C;--on-accent:#1A0F0B;--accent-text:#FF8F75;--sec:#8DB89C;--sec-soft:#1E2B22;--warning:#E2B565;--shadow:rgba(0,0,0,.62);--shadow2:rgba(0,0,0,.4);--rail:#4E4740;--wood:#2B2723;--glass:rgba(32,30,27,.86);--inv:#F3EEE8;--on-inv:#121110}
.mc *{box-sizing:border-box}
.d1,.fr{font-family:'Fraunces',Georgia,serif;font-weight:500;margin:0}
.d1{font-size:40px;line-height:1.02;letter-spacing:-.035em}
.fr{letter-spacing:-.02em}
.b2{font-size:14px;line-height:1.4;margin:0}
.cap{font-size:12px;line-height:1.3;margin:0}
.eyebrow{font-size:11px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
.press{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.press:active{transform:scale(.95);transition-duration:.12s}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.cut{filter:drop-shadow(0 6px 6px var(--shadow)) drop-shadow(0 1px 1px var(--shadow2))}
.gl{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.hanger{fill:none;stroke:var(--faint);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);flex:none}
.seg{display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);height:36px}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px var(--shadow2)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tab.on{color:var(--ink)}
.tab.on::after{content:'';position:absolute;bottom:1px;width:4px;height:4px;border-radius:2px;background:var(--accent)}
.stage{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;transition:transform .85s cubic-bezier(.34,1.18,.4,1)}
.zone{position:absolute;border-radius:16px;background:var(--wood);transition:opacity .5s ease,box-shadow .3s;overflow:hidden}
.zone:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.zone.dim{opacity:.22}
.zone.focus{box-shadow:inset 0 0 0 2px var(--accent)}
.pc{position:absolute}
.tag{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:999px;background:var(--surface);box-shadow:0 2px 6px var(--shadow2);font-size:9px;font-weight:700;white-space:nowrap}
.tag i{width:5px;height:5px;border-radius:3px;display:block}
.cap-card{position:absolute;left:16px;right:16px;bottom:104px;border-radius:24px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 34px var(--shadow2),inset 0 0 0 1px var(--line);padding:14px 14px 14px 18px;display:flex;align-items:center;gap:12px;z-index:30;transition:transform .55s cubic-bezier(.34,1.4,.5,1),opacity .3s}
.hdr{transition:opacity .4s ease}
.hdr.hide{opacity:0;pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.mc *,.mc *::before,.mc *::after{animation-duration:1ms!important;transition-duration:200ms!important;transition-timing-function:ease!important}}

</helmet>
<div class="mc {{themeClass}}" style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg)">

<div class="hdr {{hdrCls}}" style="position:absolute;left:0;right:0;top:48px;z-index:5">
<div style="padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:44px">
<span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)">Home wardrobe<svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
<a href="AddItem.dc.html" class="iconbtn press" aria-label="Add item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
<div style="padding:0 20px;display:flex;align-items:baseline;gap:10px"><h1 class="d1">Wardrobe</h1><span class="fr muted" style="font-size:22px">28</span></div>
<nav aria-label="Wardrobe view" style="margin:12px 20px 0;height:44px;border-radius:999px;background:var(--tint);padding:4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))">
<span class="seg on" aria-current="page">Closet</span><a href="Grid.dc.html" class="seg">Grid</a><a href="Grid.dc.html" class="seg">Outfits</a>
</nav>
</div>

<div class="stage" style="transform:{{stageT}}">
<div style="position:absolute;left:20px;top:244px;width:350px;height:6px;border-radius:3px;background:var(--rail);opacity:.6"></div>
<button class="{{zAcc.cls}}" onClick="{{zAcc.pick}}" aria-label="Accessories tray, 6 pieces" style="left:20px;top:200px;width:350px;height:44px;border-radius:14px 14px 4px 4px">
<sc-for list="{{acc}}" as="it" hint-placeholder-count="5"><div class="pc" style="left:{{it.x}}px;top:{{it.y}}px;width:{{it.w}}px;height:{{it.h}}px;transform:rotate({{it.r}}deg)"><svg viewBox="{{it.vb}}" class="cut" style="width:100%;height:100%;overflow:visible;display:block" aria-hidden="true"><path d="{{it.d}}" fill="{{it.fill}}"></path><path d="{{it.d}}" fill="url(#mcShade)"></path><path class="gl" d="{{it.l}}" stroke="{{it.line}}"></path></svg></div></sc-for>
</button>
<div style="position:absolute;left:14px;top:256px;width:362px;height:482px;border-radius:26px;background:var(--tint);box-shadow:inset 0 0 0 1px var(--line),0 24px 50px var(--shadow2)"></div>

<button class="{{zRail.cls}}" onClick="{{zRail.pick}}" aria-label="Hanging rail, 10 pieces, 3 out" style="left:22px;top:264px;width:218px;height:290px">
<div style="position:absolute;left:8px;right:8px;top:18px;height:3px;border-radius:2px;background:var(--rail)"></div>
<sc-for list="{{rail}}" as="it" hint-placeholder-count="8">
<div class="pc" style="left:{{it.x}}px;top:14px;width:52px;height:96px">
<svg class="hanger" viewBox="0 0 60 30" style="position:absolute;left:10px;top:0;width:32px;height:16px" aria-hidden="true"><path d="M30 14L30 11Q30 9 32 8.2Q35 7 35 4.5Q35 1.5 32 1.5Q29.5 1.5 29 4M30 14L5 26.5Q3 28 5.5 28.5L54.5 28.5Q57 28 55 26.5Z"></path></svg>
<sc-if value="{{it.inn}}" hint-placeholder-val="{{true}}"><div style="position:absolute;left:0;top:10px;width:52px;height:62px"><svg viewBox="{{it.vb}}" class="cut" style="width:100%;height:100%;overflow:visible;display:block" aria-hidden="true"><path d="{{it.d}}" fill="{{it.fill}}"></path><path d="{{it.d}}" fill="url(#mcShade)"></path><path class="gl" d="{{it.l}}" stroke="{{it.line}}"></path></svg></div></sc-if>
<sc-if value="{{it.out}}" hint-placeholder-val="{{false}}"><span class="tag" style="position:absolute;left:50%;top:22px;transform:translateX(-50%)"><i style="background:{{it.dot}}"></i>{{it.tag}}</span></sc-if>
</div>
</sc-for>
<sc-for list="{{rail2}}" as="it" hint-placeholder-count="4">
<div class="pc" style="left:{{it.x}}px;top:150px;width:52px;height:96px">
<svg class="hanger" viewBox="0 0 60 30" style="position:absolute;left:10px;top:0;width:32px;height:16px" aria-hidden="true"><path d="M30 14L30 11Q30 9 32 8.2Q35 7 35 4.5Q35 1.5 32 1.5Q29.5 1.5 29 4M30 14L5 26.5Q3 28 5.5 28.5L54.5 28.5Q57 28 55 26.5Z"></path></svg>
<div style="position:absolute;left:0;top:10px;width:52px;height:62px"><svg viewBox="{{it.vb}}" class="cut" style="width:100%;height:100%;overflow:visible;display:block" aria-hidden="true"><path d="{{it.d}}" fill="{{it.fill}}"></path><path d="{{it.d}}" fill="url(#mcShade)"></path><path class="gl" d="{{it.l}}" stroke="{{it.line}}"></path></svg></div>
</div>
</sc-for>
<div style="position:absolute;left:8px;right:8px;top:154px;height:3px;border-radius:2px;background:var(--rail)"></div>
</button>

<button class="{{zShelf.cls}}" onClick="{{zShelf.pick}}" aria-label="Shelves, 8 pieces" style="left:246px;top:264px;width:122px;height:290px;background:transparent">
<sc-for list="{{shelves}}" as="sh" hint-placeholder-count="3">
<div style="position:absolute;left:0;right:0;top:{{sh.y}}px;height:90px;border-radius:14px;background:var(--wood);overflow:hidden">
<sc-for list="{{sh.items}}" as="it" hint-placeholder-count="2"><div class="pc" style="left:{{it.x}}px;top:{{it.y}}px;width:72px;height:50px"><svg viewBox="{{it.vb}}" class="cut" style="width:100%;height:100%;overflow:visible;display:block" aria-hidden="true"><path d="{{it.d}}" fill="{{it.fill}}"></path><path d="{{it.d}}" fill="url(#mcShade)"></path><path class="gl" d="{{it.l}}" stroke="{{it.line}}"></path></svg></div></sc-for>
<div style="position:absolute;left:0;right:0;bottom:0;height:7px;background:var(--tint2)"></div>
</div>
</sc-for>
</button>

<button class="{{zDrawer.cls}}" onClick="{{zDrawer.pick}}" aria-label="Drawers, 45 pieces" style="left:22px;top:562px;width:346px;height:80px;background:transparent">
<sc-for list="{{drawers}}" as="dr" hint-placeholder-count="3">
<span style="position:absolute;left:{{dr.x}}px;top:0;width:110px;height:80px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),0 4px 10px var(--shadow2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
<span style="width:34px;height:5px;border-radius:3px;background:var(--line2)"></span>
<span class="cap" style="font-weight:700">{{dr.name}}</span>
<span class="cap muted" style="font-size:11px">{{dr.n}}</span>
</span>
</sc-for>
</button>

<button class="{{zShoes.cls}}" onClick="{{zShoes.pick}}" aria-label="Shoe rack, 4 pairs, 1 out" style="left:22px;top:650px;width:346px;height:80px">
<sc-for list="{{shoes}}" as="it" hint-placeholder-count="4">
<div class="pc" style="left:{{it.x}}px;top:12px;width:78px;height:52px">
<sc-if value="{{it.inn}}" hint-placeholder-val="{{true}}"><svg viewBox="{{it.vb}}" class="cut" style="width:100%;height:100%;overflow:visible;display:block" aria-hidden="true"><path d="{{it.d}}" fill="{{it.fill}}"></path><path d="{{it.d2}}" fill="{{it.f2}}"></path><path d="{{it.d}}" fill="url(#mcShade)"></path><path class="gl" d="{{it.l}}" stroke="{{it.line}}"></path></svg></sc-if>
<sc-if value="{{it.out}}" hint-placeholder-val="{{false}}"><span class="tag" style="position:absolute;left:50%;top:18px;transform:translateX(-50%)"><i style="background:{{it.dot}}"></i>{{it.tag}}</span></sc-if>
</div>
</sc-for>
<div style="position:absolute;left:10px;right:10px;bottom:12px;height:3px;border-radius:2px;background:var(--rail)"></div>
</button>
</div>

<div class="cap-card" style="transform:{{capT}}">
<div style="flex:1;min-width:0">
<p class="eyebrow">{{capEyebrow}}</p>
<p class="fr" style="font-size:22px;line-height:1.15;margin-top:4px">{{capTitle}}</p>
<p class="cap muted" style="margin-top:3px;font-weight:600">{{capMeta}}</p>
</div>
<sc-if value="{{zoomed}}" hint-placeholder-val="{{false}}">
<button class="iconbtn press" onClick="{{zoomOut}}" aria-label="Back to the whole closet"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"></path></svg></button>
<a href="Closet.dc.html" class="press" style="height:44px;padding:0 16px;border-radius:999px;background:var(--inv);color:var(--on-inv);display:flex;align-items:center;font-size:14px;font-weight:600">Open</a>
</sc-if>
</div>

<nav aria-label="Main" style="position:absolute;left:16px;right:16px;bottom:20px;height:70px;border-radius:30px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 14px 34px var(--shadow2),inset 0 0 0 1px var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:0 4px;z-index:40">
<a href="Today.dc.html" class="tab press"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg><span>Today</span></a>
<a href="ClosetB.dc.html" class="tab press on" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5.5a2 2 0 1 1 2 2v1.5l8.4 6.2a1.4 1.4 0 0 1-.8 2.5H4.4a1.4 1.4 0 0 1-.8-2.5L12 9"></path></svg><span>Wardrobe</span></a>
<a href="AddItem.dc.html" aria-label="Add item" class="press" style="justify-self:center;width:62px;height:62px;border-radius:31px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;margin-top:-34px;box-shadow:0 12px 24px rgba(226,85,63,.42),0 0 0 6px var(--bg)"><svg class="ic" viewBox="0 0 24 24" style="width:26px;height:26px;stroke-width:2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
<a href="Planner.dc.html" class="tab press"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="3"></rect><path d="M8 2.5v4M16 2.5v4M3 10h18"></path></svg><span>Planner</span></a>
<a href="Me.dc.html" class="tab press"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span>Me</span></a>
</nav>
</div>
