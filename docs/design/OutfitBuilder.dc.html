<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Closet — Outfit builder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.mc{--bg:#F7F3EE;--surface:#FFFFFF;--tint:#EFE8DF;--tint2:#E4D9CB;--ink:#1C1A17;--muted:#6E6860;--faint:#8A847C;--line:rgba(28,26,23,.09);--line2:rgba(28,26,23,.17);--accent:#E2553F;--accent-fill:#C2412C;--on-accent:#FFFFFF;--accent-text:#B23A26;--accent-soft:#F8E0D8;--sec:#2F4B3A;--on-sec:#FFFFFF;--sec-soft:#DFE8E1;--success:#2F6B45;--success-soft:#DCEBE0;--danger:#A8321F;--danger-soft:#F7DED7;--shadow:rgba(84,58,34,.24);--shadow2:rgba(84,58,34,.12);--board:#ECE5DB;--glass:rgba(255,255,255,.9);--inv:#1C1A17;--on-inv:#F7F3EE;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.mc.dark{--bg:#121110;--surface:#1D1B19;--tint:#26231F;--tint2:#312C27;--ink:#F3EEE8;--muted:#9C958C;--faint:#6F6962;--line:rgba(243,238,232,.08);--line2:rgba(243,238,232,.17);--accent:#FF7A5C;--accent-fill:#FF7A5C;--on-accent:#1A0F0B;--accent-text:#FF8F75;--accent-soft:#3B231C;--sec:#8DB89C;--on-sec:#0F1A12;--sec-soft:#1E2B22;--success:#86C59B;--success-soft:#1B2A20;--danger:#F08A75;--danger-soft:#35201B;--shadow:rgba(0,0,0,.62);--shadow2:rgba(0,0,0,.4);--board:#1A1816;--glass:rgba(32,30,27,.9);--inv:#F3EEE8;--on-inv:#121110}
.mc *{box-sizing:border-box}
.d3,.fr{font-family:'Fraunces',Georgia,serif;font-weight:500;margin:0}
.d3{font-size:28px;line-height:1.1;letter-spacing:-.025em}
.fr{letter-spacing:-.02em}
.b2{font-size:14px;line-height:1.4;margin:0}
.cap{font-size:12px;line-height:1.3;margin:0}
.eyebrow{font-size:11px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0}
.muted{color:var(--muted)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
.press{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.press:active{transform:scale(.93);transition-duration:.12s}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.cut{filter:drop-shadow(0 12px 10px var(--shadow)) drop-shadow(0 1px 2px var(--shadow2))}
.gl{fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2);white-space:nowrap;flex:none;position:relative;transition:background-color .25s,color .25s,transform .45s cubic-bezier(.34,1.56,.64,1)}
.chip::before{content:'';position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.chip.on{background:var(--inv);color:var(--on-inv);box-shadow:none}
.iconbtn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);flex:none}
.btn{height:52px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 22px;font-size:16px;font-weight:600}
.btn-ink{background:var(--inv);color:var(--on-inv)}
.btn-accent{background:var(--accent-fill);color:var(--on-accent)}
.btn-line{box-shadow:inset 0 0 0 1.5px var(--line2)}
.board{position:absolute;left:12px;top:108px;width:366px;height:476px;border-radius:28px;background-color:var(--board);background-image:radial-gradient(var(--line2) 1px,transparent 1.3px);background-size:18px 18px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);touch-action:none}
.obi{cursor:grab;touch-action:none}
.obi:active{cursor:grabbing}
.tool{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.tool:hover{background:var(--tint)}
.trash{position:absolute;left:151px;bottom:20px;width:64px;height:64px;border-radius:32px;background:var(--surface);color:var(--danger);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px var(--shadow);transform:translateY(120px);transition:transform .5s cubic-bezier(.34,1.56,.64,1),background-color .25s,color .25s;z-index:35;pointer-events:none}
.trash.show{transform:none}
.trash.hot{transform:scale(1.22);background:var(--danger);color:var(--bg)}
.tile{flex:none;width:80px;height:96px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:12px 10px;position:relative}
.scrim{position:absolute;inset:0;background:rgba(12,10,8,.4);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:50;width:100%;border:0}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:-28px;z-index:51;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px 62px;transform:translateY(110%);transition:transform .6s cubic-bezier(.32,1.18,.5,1);box-shadow:0 -12px 40px var(--shadow2)}
.sheet.on{transform:translateY(0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 16px}
.toast{position:absolute;left:50%;top:52px;z-index:70;transform:translate(-50%,-160%);opacity:0;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;background:var(--inv);color:var(--on-inv);border-radius:999px;padding:10px 16px 10px 12px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 12px 28px var(--shadow);pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
@keyframes popA{0%{transform:scale(.5) rotate(-10deg);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:none;opacity:1}}
@keyframes popB{0%{transform:scale(.5) rotate(10deg);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:none;opacity:1}}
.popA{animation:popA .6s cubic-bezier(.34,1.56,.64,1) both}
.popB{animation:popB .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.mc *,.mc *::before,.mc *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:200ms!important;transition-timing-function:ease!important}}
</style>
</helmet>
<div class="mc {{themeClass}}" ref="{{setRoot}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerLeave="{{onUp}}" style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);user-select:none;-webkit-user-select:none">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="mcShade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#ffffff;stop-opacity:.26"></stop><stop offset=".5" style="stop-color:#ffffff;stop-opacity:0"></stop><stop offset="1" style="stop-color:#000000;stop-opacity:.18"></stop></linearGradient></defs></svg>

<div style="position:absolute;left:16px;right:16px;top:48px;display:flex;align-items:center;gap:10px">
<a href="Grid.dc.html" class="iconbtn press" aria-label="Close builder"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
<div style="flex:1;min-width:0"><p class="fr" style="font-size:22px;line-height:1.1">New outfit</p><p class="cap muted" style="margin-top:2px">{{countLine}}</p></div>
<button class="iconbtn press" onClick="{{shuffle}}" aria-label="Shuffle unlocked pieces"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h1.97a4 4 0 0 0 3.3-1.7l5.45-7.6a4 4 0 0 1 3.3-1.7H22M2 6h1.97a4 4 0 0 1 3.6 2.2M22 18h-6.04a4 4 0 0 1-3.3-1.8l-.36-.45"></path></svg></button>
<button class="press" onClick="{{openSave}}" style="height:44px;padding:0 18px;border-radius:999px;background:var(--accent-fill);color:var(--on-accent);font-size:15px;font-weight:600">Save</button>
</div>

<div class="board" ref="{{setBoard}}" onPointerDown="{{deselect}}" aria-label="Outfit canvas">
<sc-if value="{{guideV}}" hint-placeholder-val="{{false}}"><div style="position:absolute;left:183px;top:0;bottom:0;width:0;border-left:1.5px dashed var(--accent);z-index:29"></div></sc-if>
<sc-if value="{{guideH}}" hint-placeholder-val="{{false}}"><div style="position:absolute;top:238px;left:0;right:0;height:0;border-top:1.5px dashed var(--accent);z-index:29"></div></sc-if>
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<div class="obi" onPointerDown="{{it.down}}" role="img" aria-label="{{it.name}}" style="position:absolute;left:0;top:0;width:{{it.w}}px;height:{{it.h}}px;z-index:{{it.z}};transform:translate({{it.x}}px,{{it.y}}px) rotate({{it.r}}deg) scale({{it.s}});opacity:{{it.op}};transition:opacity .2s">
<div class="{{it.anim}}" style="width:100%;height:100%"><svg viewBox="{{it.vb}}" class="cut" style="width:100%;height:100%;overflow:visible;display:block;pointer-events:none" aria-hidden="true"><path d="{{it.d}}" fill="{{it.fill}}"></path><path d="{{it.d2}}" fill="{{it.f2}}"></path><path d="{{it.d}}" fill="url(#mcShade)"></path><path class="gl" d="{{it.l}}" stroke="{{it.line}}"></path></svg></div>
</div>
</sc-for>
<sc-for list="{{locks}}" as="k" hint-placeholder-count="1">
<span style="position:absolute;left:{{k.x}}px;top:{{k.y}}px;width:24px;height:24px;border-radius:12px;background:var(--inv);color:var(--on-inv);display:flex;align-items:center;justify-content:center;z-index:31;pointer-events:none"><svg class="ic" viewBox="0 0 24 24" style="width:13px;height:13px;stroke-width:2.2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
</sc-for>
<sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;left:{{ov.l}}px;top:{{ov.t}}px;width:{{ov.w}}px;height:{{ov.h}}px;transform:rotate({{ov.r}}deg);border:1.5px dashed var(--accent);border-radius:12px;pointer-events:none;z-index:30">
<button onPointerDown="{{hdown}}" aria-label="Drag to scale and rotate" style="position:absolute;right:-18px;bottom:-18px;width:36px;height:36px;border-radius:18px;background:var(--accent-fill);color:var(--on-accent);pointer-events:auto;cursor:nwse-resize;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px var(--shadow);touch-action:none"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px;stroke-width:2.2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"></path></svg></button>
</div>
<sc-if value="{{showTools}}" hint-placeholder-val="{{true}}">
<div style="position:absolute;left:0;right:0;bottom:14px;z-index:34;display:flex;justify-content:center;pointer-events:none">
<div class="pop" style="display:flex;gap:2px;padding:4px;border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 26px var(--shadow2),inset 0 0 0 1px var(--line);pointer-events:auto" onPointerDown="{{stop}}">
<button class="tool press" onClick="{{toggleLock}}" aria-pressed="{{selLocked}}" aria-label="{{lockLabel}}" style="{{lockStyle}}">
<sc-if value="{{selLocked}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" style="width:19px;height:19px" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if>
<sc-if value="{{selUnlocked}}" hint-placeholder-val="{{true}}"><svg class="ic" viewBox="0 0 24 24" style="width:19px;height:19px" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.9-1"></path></svg></sc-if>
</button>
<button class="tool press" onClick="{{forward}}" aria-label="Bring forward"><svg class="ic" viewBox="0 0 24 24" style="width:19px;height:19px" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M4 16V6a2 2 0 0 1 2-2h10"></path></svg></button>
<button class="tool press" onClick="{{backward}}" aria-label="Send backward"><svg class="ic" viewBox="0 0 24 24" style="width:19px;height:19px" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="2"></rect><path d="M20 8v10a2 2 0 0 1-2 2H8"></path></svg></button>
<button class="tool press" onClick="{{remove}}" aria-label="Remove from outfit" style="color:var(--danger)"><svg class="ic" viewBox="0 0 24 24" style="width:19px;height:19px" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
</div>
</div>
</sc-if>
</sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div class="pop" style="position:absolute;left:40px;right:40px;top:150px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px">
<svg viewBox="0 0 24 24" style="width:46px;height:46px;fill:none;stroke:var(--faint);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7z"></path><path d="m2 17 10 5 10-5M2 12l10 5 10-5"></path></svg>
<p class="fr" style="font-size:22px">An empty board</p>
<p class="b2 muted">Tap pieces in the tray below to start styling.</p>
</div>
</sc-if>
<div class="{{trashCls}}" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" style="width:24px;height:24px" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></div>
<p class="cap muted" style="position:absolute;left:16px;top:14px;font-weight:600;pointer-events:none">{{hint}}</p>
</div>

<div style="position:absolute;left:0;right:0;top:598px;bottom:0">
<div class="noscroll" style="display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6"><button class="{{t.cls}}" aria-pressed="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
</div>
<div class="noscroll" style="display:flex;gap:10px;overflow-x:auto;padding:2px 16px 24px">
<sc-for list="{{tray}}" as="p" hint-placeholder-count="5">
<button class="tile press" onClick="{{p.add}}" aria-label="Add {{p.name}}">
<svg viewBox="{{p.vb}}" class="cut" style="width:100%;height:100%;overflow:visible;display:block" aria-hidden="true"><path d="{{p.d}}" fill="{{p.fill}}"></path><path d="{{p.d2}}" fill="{{p.f2}}"></path><path d="{{p.d}}" fill="url(#mcShade)"></path><path class="gl" d="{{p.l}}" stroke="{{p.line}}"></path></svg>
<sc-if value="{{p.onBoard}}" hint-placeholder-val="{{false}}"><span style="position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:10px;background:var(--success);color:var(--bg);display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" style="width:12px;height:12px;stroke-width:3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>
</button>
</sc-for>
</div>
</div>

<div class="toast {{toastCls}}" role="status" aria-live="polite"><span style="width:22px;height:22px;border-radius:11px;background:var(--success);color:var(--bg);display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:2.8" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>{{toast}}</div>

<button class="scrim {{saveCls}}" aria-label="Close" onClick="{{closeSave}}"></button>
<div class="sheet {{saveCls}}" role="dialog" aria-label="Save outfit">
<div class="grab"></div>
<sc-if value="{{notSaved}}" hint-placeholder-val="{{true}}">
<h3 class="d3">Save outfit</h3>
<label style="display:block;margin-top:14px"><span class="eyebrow">Name</span><input value="{{name}}" onChange="{{onName}}" style="margin-top:8px;width:100%;height:50px;border-radius:14px;border:0;outline:0;padding:0 14px;background:var(--tint);font-size:17px;font-family:Fraunces,Georgia,serif"></label>
<p class="eyebrow" style="margin:18px 0 10px">Occasion</p>
<div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{occs}}" as="o" hint-placeholder-count="4"><button class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
<p class="eyebrow" style="margin:18px 0 10px">Seasons</p>
<div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{seasons}}" as="o" hint-placeholder-count="4"><button class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
<button class="btn btn-ink press" onClick="{{doSave}}" style="width:100%;margin-top:22px">Save outfit</button>
</sc-if>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
<div style="display:flex;gap:16px;align-items:center">
<div class="pop" style="width:146px;height:190px;border-radius:18px;overflow:hidden;position:relative;flex:none;background:var(--board);box-shadow:0 14px 30px var(--shadow2)">
<div style="position:absolute;left:0;top:0;width:366px;height:476px;transform:scale(.4);transform-origin:0 0">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5"><div style="position:absolute;left:0;top:0;width:{{it.w}}px;height:{{it.h}}px;z-index:{{it.z}};transform:translate({{it.x}}px,{{it.y}}px) rotate({{it.r}}deg) scale({{it.s}})"><svg viewBox="{{it.vb}}" class="cut" style="width:100%;height:100%;overflow:visible;display:block" aria-hidden="true"><path d="{{it.d}}" fill="{{it.fill}}"></path><path d="{{it.d2}}" fill="{{it.f2}}"></path><path d="{{it.d}}" fill="url(#mcShade)"></path><path class="gl" d="{{it.l}}" stroke="{{it.line}}"></path></svg></div></sc-for>
</div>
</div>
<div style="flex:1;min-width:0">
<p class="eyebrow" style="color:var(--success)">Saved to outfits</p>
<p class="fr" style="font-size:24px;line-height:1.1;margin-top:6px">{{name}}</p>
<p class="cap muted" style="margin-top:6px">{{savedMeta}}</p>
</div>
</div>
<div style="display:flex;gap:10px;margin-top:22px">
<a href="Planner.dc.html" class="btn btn-line press" style="flex:1">Plan it</a>
<a href="Grid.dc.html" class="btn btn-ink press" style="flex:1">View outfits</a>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      theme: null, sel: 'u2', tab: 'tops', shuf: 0, dragging: false, gv: false, gh: false, hot: false, saveOpen: false, saved: false,
      name: 'Sunday gallery', occ: 'Weekend', seasons: { Autumn: true }, toast: '', toastOn: false, uid: 6,
      items: [
        { uid: 'u1', kind: 'jacket', c: '#26354E', name: 'Navy blazer', x: 20, y: 40, s: 1, r: -6, z: 1, locked: false },
        { uid: 'u3', kind: 'pants', c: '#B8AD9E', name: 'Stone chinos', x: 214, y: 116, s: 1, r: 4, z: 2, locked: false },
        { uid: 'u2', kind: 'shirt', c: '#E8DDC8', name: 'Ecru linen shirt', x: 118, y: 26, s: 1, r: 3, z: 3, locked: true },
        { uid: 'u4', kind: 'loafer', c: '#1D1C1B', name: 'Black loafers', x: 36, y: 300, s: 1, r: -4, z: 4, locked: false },
        { uid: 'u5', kind: 'tote', c: '#B98B5E', name: 'Camel tote', x: 232, y: 290, s: 0.95, r: 7, z: 5, locked: false }
      ]
    };
    this.onStorage = (e) => { if (e && e.key === 'mycloset-theme') this.setState({ theme: e.newValue }); };
    this.setRoot = (el) => { this.rootEl = el; };
    this.setBoard = (el) => { this.boardEl = el; };
    this.deselect = () => { if (!this.drag) this.setState({ sel: null }); };
    this.stop = (e) => { e.stopPropagation(); };
    this.openSave = () => this.setState({ saveOpen: true, saved: false });
    this.closeSave = () => this.setState({ saveOpen: false });
    this.onName = (e) => this.setState({ name: e.target.value });
    this.doSave = () => { this.setState({ saved: true }); this.toast('Outfit saved'); };
    this.onMove = (e) => this.move(e);
    this.onUp = () => this.up();
